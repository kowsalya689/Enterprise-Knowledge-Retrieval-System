# Whole system in Docker:  Qdrant + Redis + Ollama + the FastAPI app.
#
#   cp .env.example .env            (set API_KEYS; Qdrant, Redis and Ollama addresses are set below)
#   docker compose up --build       (first start: downloads the embedding model, about 1.9 GB, and the Ollama model)
#   docker compose exec app python -m app.ingestion.indexer     (load the 11 documents, once)
#
# App outside Docker (only the services in Docker):
#   docker compose up qdrant redis ollama ollama-pull      then in .env: QDRANT_URL=http://localhost:6333
#   REDIS_URL=redis://localhost:6379/0  OLLAMA_BASE_URL=http://localhost:11434   and run: uvicorn app.main:app --reload
#
# Pages:  http://localhost:8000/chat   http://localhost:8000/upload   http://localhost:8000/docs
services:
  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"                              # dashboard: http://localhost:6333/dashboard

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"                    # only this computer; lets the app run outside Docker too

  ollama:
    image: ollama/ollama
    profiles: ["docker-ollama"]            # off by default: this setup uses the Ollama installed on Windows
    environment:
      OLLAMA_KEEP_ALIVE: 24h              # keep the model in memory (default: unload after 5 minutes)
      OLLAMA_NUM_PARALLEL: "1"             # one request at a time: less memory
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  ollama-pull:                                   # one-shot job: downloads the model, then exits
    image: ollama/ollama
    profiles: ["docker-ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_LIBREOFFICE: "false"
    env_file: .env
    environment:                                 # inside Docker the other services are reached by name
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      QDRANT_LOCAL_PATH: ""
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434      # the Ollama installed on Windows
    ports:
      - "127.0.0.1:8000:8000"                    # only this computer can open the pages and the API
    volumes:
      - uploaded_documents:/app/data/documents
      - hf_cache:/models/hf                      # embedding model is downloaded once
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  uploaded_documents:
  hf_cache:
  redis_data:
  ollama_models:
  qdrant_storage: